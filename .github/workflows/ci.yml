##############################################################
# BLA — Pipeline CI/CD GitHub Actions
# Déclencheurs : push sur main/develop + PR sur main
#
# Contrôles uniquement : le déploiement n'est pas fait ici. Render (API, branche main)
# et Vercel (site et administration) compilent directement depuis le dépôt.
##############################################################

name: BLA CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  # ────────────────────────────────────────────────────────
  #  Tests Backend
  # ────────────────────────────────────────────────────────
  test-backend:
    name: Tests Backend (Node.js + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB:       bla_test
          POSTGRES_USER:     bla_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: cd backend && npm ci

      - name: Générer le client Prisma
        run: cd backend && npx prisma generate

      - name: Initialiser les extensions PostgreSQL
        run: |
          PGPASSWORD=test_password psql -h localhost -U bla_user -d bla_test -c "
            CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
            CREATE EXTENSION IF NOT EXISTS postgis;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
          "

      - name: Appliquer les migrations
        run: cd backend && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://bla_user:test_password@localhost:5432/bla_test

      - name: Linting
        run: cd backend && npm run lint

      - name: Tests avec couverture
        run: cd backend && npm run test:coverage
        env:
          NODE_ENV:           test
          DATABASE_URL:       postgresql://bla_user:test_password@localhost:5432/bla_test
          # Active les tests sur base réelle (tests/db : confidentialité, anti-rejeu, transitions).
          # Base jetable du service CI ci-dessus — jamais une base distante (refusé par les tests).
          TEST_DATABASE_URL:  postgresql://bla_user:test_password@localhost:5432/bla_test
          REDIS_URL:          redis://localhost:6379
          JWT_PRIVATE_KEY:    ${{ secrets.JWT_PRIVATE_KEY_TEST }}
          JWT_PUBLIC_KEY:     ${{ secrets.JWT_PUBLIC_KEY_TEST }}
          ENCRYPTION_KEY:     ${{ secrets.ENCRYPTION_KEY_TEST }}
          PORT:               3000
          APP_URL:            http://localhost:3000
          CORS_ORIGIN:        http://localhost:5173

      - name: Upload couverture vers Codecov
        uses: codecov/codecov-action@v4
        with:
          token:  ${{ secrets.CODECOV_TOKEN }}
          flags:  backend
          directory: ./backend/coverage

  # ────────────────────────────────────────────────────────
  #  Tests Frontend Web
  # ────────────────────────────────────────────────────────
  test-frontend:
    name: Tests Frontend Web (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      - name: Installer les dépendances
        run: cd frontend-web && npm ci

      - name: Linting
        run: cd frontend-web && npm run lint

      - name: Tests avec couverture
        run: cd frontend-web && npm run test:coverage

      - name: Build de production
        run: cd frontend-web && npm run build
        env:
          VITE_API_URL: https://api.bla-app.com/api/v1

  # ────────────────────────────────────────────────────────
  #  Tests Frontend Admin
  # ────────────────────────────────────────────────────────
  test-admin:
    name: Tests Frontend Admin (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Installer les dépendances
        run: cd frontend-admin && npm ci

      - name: Linting
        run: cd frontend-admin && npm run lint

      - name: Tests
        run: cd frontend-admin && npm test

      - name: Build de production
        run: cd frontend-admin && npm run build
        env:
          VITE_API_URL: https://api.blalinker.com/api/v1

  # ────────────────────────────────────────────────────────
  #  Audit de sécurité
  # ────────────────────────────────────────────────────────
  security-audit:
    name: Audit sécurité
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-admin]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Gate de sécurité sur les dépendances de PRODUCTION (celles réellement déployées).
      # Les vulnérabilités des outils de dev (vite/vitest/esbuild — serveur de dev)
      # ne partent pas en production ; on les suit hors blocage du pipeline.
      # high/critical bloquants, sauf exceptions nominatives et datées :
      # security/audit-allowlist.json (documentation : security/EXCEPTIONS-AUDIT.md).
      - name: Audit dépendances backend (production, high+)
        run: |
          cd backend
          npm ci
          node ../scripts/audit-gate.mjs .

      - name: Audit dépendances frontend (production, high+)
        run: |
          cd frontend-web
          npm ci
          node ../scripts/audit-gate.mjs .

      - name: Audit dépendances admin (production, high+)
        run: |
          cd frontend-admin
          npm ci
          node ../scripts/audit-gate.mjs .

      - name: Semgrep — analyse statique de sécurité
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/nodejs
            p/jwt
            p/sql-injection
            p/xss
            p/secrets
